services:

  # ── PostgreSQL（全量结构化数据 + 中文全文检索）──────────────────────────────
  postgres:
    image: zhparser/zhparser:alpine-16
    platform: linux/amd64  # 上游镜像仅发布 amd64；Docker Desktop/ARM 主机会自动模拟
    container_name: yueling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yueling
      POSTGRES_USER: yueling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yueling}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yueling -d yueling"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── 月灵 Bot ─────────────────────────────────────────────────────────────────
  bot:
    # 服务器直接 pull 默认镜像；本地执行 docker compose up -d --build 时仍会从源码构建。
    image: ${YUELING_IMAGE:-ghcr.io/yuelioi/yueling-go:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yueling-bot
    restart: unless-stopped
    environment:
      YUELING_DATABASE_DSN: postgres://yueling@postgres:5432/yueling?sslmode=disable
      YUELING_FEED_RSSHUB_BASE: http://rsshub:1200  # Compose 内部地址，覆盖 config.toml 的公共实例
      PGPASSWORD: ${POSTGRES_PASSWORD:-yueling}
    volumes:
      - ./config.toml:/app/config.toml:ro  # 配置文件（只读挂载）
      - ./data:/app/data                    # 持久化文件（图片 / 备份 / 字体）
    depends_on:
      postgres:
        condition: service_healthy
      napcat:
        condition: service_started
      meme:
        condition: service_started
        required: false  # meme 服务不存在时 bot 照常启动
      rsshub:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 让容器内可访问宿主机（代理等）
    ports:
      - "9077:9077"  # 反向 WS 监听端口
      # - "9078:9078"  # 外部发消息 HTTP API（启用 [http_api] 且需从宿主机/外网访问时取消注释；
      #                #  同 compose 网络内调用方用 http://bot:9078 直连，无需映射）
      - "9080:9080"  # WebUI 管理后台（启用 [webui] 后访问 http://127.0.0.1:9080）
    # ── NapCat 连通说明 ────────────────────────────────────────────────────────
    # 推荐（容器内反向 WS，配合下方 napcat 服务）：
    #   - config.toml 设 serve = ":9077"
    #   - 在 NapCat WebUI 加一个「WebSocket 客户端」，地址填：ws://bot:9077/onebot/v11/ws
    #     （bot 为本 compose 服务名，容器间用服务名互通，无需宿主机 IP）
    #
    # 正向 WS（bot 主动连 NapCat，替代方案）：
    #   - 在 NapCat WebUI 启「WebSocket 服务器」，config.toml 设 url = "ws://napcat:3001"

  # ── NapCat（QQ 协议端）────────────────────────────────────────────────────────
  # 镜像：https://github.com/NapNeko/NapCat-Docker
  # 首次启动：
  #   1. docker compose up -d --build
  #   2. 浏览器开 http://<宿主机IP>:6099/webui （登录 token 见 docker logs yueling-napcat，默认 napcat）
  #   3. 扫码登录 QQ
  #   4. 网络配置 → 新建「WebSocket 客户端」→ 地址 ws://bot:9077/onebot/v11/ws （token 与 config.toml 一致）
  # 登录态与配置已持久化到下方 volume，重启免重扫。
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: yueling-napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-0}  # 上游 entrypoint 默认 0(root)；Linux 想用宿主机权限可覆盖为 $(id -u)
      - NAPCAT_GID=${NAPCAT_GID:-0}
    ports:
      - "6099:6099"  # WebUI —— 唯一需对宿主机暴露的端口（反向 WS 下 NapCat 不需入站 OneBot 端口）
    volumes:
      - napcat-qq:/app/.config/QQ          # QQ 登录态（Dockerfile VOLUME /app/.config/QQ）
      - napcat-config:/app/napcat/config   # NapCat 配置（Dockerfile VOLUME /app/napcat/config）

  # ── meme-generator-rs ────────────────────────────────────────────────────────
  # 提供 130+ 表情包生成能力。
  # config.toml 中设置 meme_server = "http://meme:2233"
  # 镜像地址：https://github.com/MemeCrafters/meme-generator-rs
  meme:
    image: ghcr.io/memecrafters/meme-generator-rs:latest
    container_name: yueling-meme
    restart: unless-stopped
    volumes:
      - meme-data:/root/.meme_generator  # 字体 / 模板资产持久化
    expose:
      - "2233"

  # ── RSSHub（B站 / X 平台订阅）────────────────────────────────────────────────
  # 使用自建实例，避免公共演示实例的限流、Cloudflare 验证和跨境网络超时。
  # 可选账号凭证放在 .env.rsshub；不配置时 B站路由会由内置 Chromium 获取访客 Cookie。
  rsshub:
    image: ghcr.io/diygod/rsshub:chromium-bundled
    container_name: yueling-rsshub
    restart: unless-stopped
    env_file:
      - path: .env.rsshub
        required: false
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
    expose:
      - "1200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s
    depends_on:
      rsshub-redis:
        condition: service_healthy

  rsshub-redis:
    image: redis:alpine
    container_name: yueling-rsshub-redis
    restart: unless-stopped
    volumes:
      - rsshub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  meme-data:
  napcat-qq:
  napcat-config:
  rsshub-redis-data:  # RSSHub Redis 缓存；必须与 rsshub-redis 的挂载名一致
